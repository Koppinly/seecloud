<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Purchase App</title>
    <link rel="stylesheet" href="../styles.css">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.optimizely.com/js/4802505738027008.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">
    <div class="container flex-grow-1" style="max-width: 1000px;">
        <header class="global-header w-100">
            <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 rounded" style="box-shadow: 0 1px 6px rgba(0,0,0,0.03);">
                <a href="/seecloud/index.html" class="navbar-brand home-icon" title="Home" style="font-size:1.5rem; color:inherit;">
                    <i class="fa fa-home"></i>
                </a>
                <span class="navbar-text ml-2 font-weight-bold" style="font-family: 'Inconsolata', monospace; font-size: 1.3rem; letter-spacing: -0.03em;">SeeCloud</span>
                <ul class="navbar-nav ml-4">
                    <li class="nav-item"><a class="nav-link" href="/function/applications.html">Applications</a></li>
                    <li class="nav-item"><a class="nav-link" href="/function/function.html">Function</a></li>
                    <li class="nav-item"><a class="nav-link" href="#page2">Games (dead)</a></li>
                </ul>
            </nav>
            <div class="header-line mt-3"></div>
        </header>
        <main class="overflow-auto flex-grow-1 pt-2">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <h2>Fake Purchase Form</h2>
                    <form id="purchaseForm">
                        <div class="form-group">
                            <label for="item">Item</label>
                            <select class="form-control" id="item" name="item" required>
                                <option value="Shoes">Shoes</option>
                                <option value="Shirt">Shirt</option>
                                <option value="Hats">Hats</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="color">Color</label>
                            <select class="form-control" id="color" name="color" required>
                                <option value="Red">Red</option>
                                <option value="Green">Green</option>
                                <option value="Blue">Blue</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="quantity">Quantity</label>
                            <input type="number" class="form-control" id="quantity" name="quantity" min="1" value="1" required>
                        </div>
                        <div class="form-group">
                            <label>Price: $<span id="price">9.99</span></label>
                        </div>
                        <button type="submit" class="btn btn-primary">Submit Purchase</button>
                    </form>
                </div>
            </div>
        </main>
        <footer class="mt-auto">
            <p class="copyright text-center py-3">© 2024 seecloud</p>
        </footer>
    </div>
    <script>
    const pricePerItem = 9.99;
    const form = document.getElementById('purchaseForm');
    const quantityInput = document.getElementById('quantity');
    const priceDisplay = document.getElementById('price');
    quantityInput.addEventListener('input', function() {
        const qty = parseInt(quantityInput.value) || 1;
        priceDisplay.textContent = (qty * pricePerItem).toFixed(2);
    });
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const item = document.getElementById('item').value;
        const quantity = parseInt(document.getElementById('quantity').value) || 1;
        const value = quantity * pricePerItem;
        // Build properties object with value in cents
        const properties = { Shoes: '', Shirt: '', Hats: '' };
        properties[item] = String(Math.round(value * 100));
        window['optimizely'] = window['optimizely'] || [];
        window['optimizely'].push({
            type: "event",
            eventName: "item_purchase",
            tags: {
                revenue: 0,
                value: value
            },
            properties: properties
        });
        alert(`Submitted: ${quantity} ${item}(s) for $${value.toFixed(2)}`);
        form.reset();
        priceDisplay.textContent = pricePerItem.toFixed(2);
    });
    </script>
    <script src="../main.js"></script>
</body>
</html>
